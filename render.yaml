services:
  - type: web
    name: ulnet-api
    env: node
    plan: free
    buildCommand: npm install --legacy-peer-deps
    startCommand: node src/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        value: sqlite://local
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
